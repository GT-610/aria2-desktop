name: flutter analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install analysis dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev shellcheck

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool/*.dart

      - name: Check release shell scripts
        run: shellcheck --shell=bash tool/*.sh

      - name: Analyze project source
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

  windows_package:
    name: Windows release package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build and verify Windows release package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tool\build_windows_release.ps1 -BuildName '0.0.0' -BuildNumber '0'

  macos_package:
    name: macOS release package
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build and verify macOS release package
        shell: bash
        env:
          MACOS_AD_HOC_SIGNING: "true"
        run: |
          chmod +x tool/prepare_aria2_next.sh tool/package_macos_release.sh
          tool/package_macos_release.sh \
            macos-arm64 \
            0.0.0 \
            0 \
            ci \
            arm64 \
            "$RUNNER_TEMP/dist"

  linux_package:
    name: Linux release package
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          export NEEDRESTART_SUSPEND=1
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo -E apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev libnotify-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build and verify Linux release package
        shell: bash
        run: |
          chmod +x tool/prepare_aria2_next.sh tool/package_linux_release.sh
          tool/package_linux_release.sh \
            linux-x64 \
            linux-x64 \
            x64 \
            amd64 \
            0.0.0 \
            0 \
            ci \
            x64 \
            "$RUNNER_TEMP/dist"
