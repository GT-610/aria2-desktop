name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setsuna-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_COUNT="$(git rev-list --count HEAD)"
          REVISION=0

          while git rev-parse -q --verify "refs/tags/v1.0.${COMMIT_COUNT}+${REVISION}" >/dev/null; do
            REVISION=$((REVISION + 1))
          done

          VERSION_NAME="1.0.${COMMIT_COUNT}"
          TAG_NAME="v${VERSION_NAME}+${REVISION}"
          RELEASE_NAME="v${COMMIT_COUNT} (rev ${REVISION})"

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build and verify Windows release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\tool\build_windows_release.ps1 `
            -BuildName '${{ needs.prepare.outputs.version_name }}' `
            -BuildNumber '${{ needs.prepare.outputs.build_number }}'

      - name: Create Windows archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = "${{ github.workspace }}\build\windows\x64\runner\Release"
          $outputDir = "${{ github.workspace }}\dist"
          $archive = Join-Path $outputDir "Setsuna_${{ needs.prepare.outputs.tag_name }}_windows_x64.zip"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $archive -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: setsuna-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS ${{ matrix.artifact_arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            core_target: macos-arm64
            artifact_arch: arm64
          - runner: macos-15-intel
            core_target: macos-x64
            artifact_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve macOS signing mode
        id: signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_BASE64" ]]; then
            echo "ad_hoc_signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "ad_hoc_signing=true" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate configured; building an ad hoc-signed, non-notarized package."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.ad_hoc_signing == 'false'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_BASE64:?MACOS_CERTIFICATE_BASE64 is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/setsuna-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          trap 'rm -f "$certificate_path"' EXIT

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

      - name: Build, bundle, and verify macOS release
        shell: bash
        env:
          MACOS_AD_HOC_SIGNING: ${{ steps.signing.outputs.ad_hoc_signing }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          chmod +x tool/prepare_aria2_next.sh tool/package_macos_release.sh
          tool/package_macos_release.sh \
            '${{ matrix.core_target }}' \
            '${{ needs.prepare.outputs.version_name }}' \
            '${{ needs.prepare.outputs.build_number }}' \
            '${{ needs.prepare.outputs.tag_name }}' \
            '${{ matrix.artifact_arch }}' \
            '${{ github.workspace }}/dist'

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: setsuna-macos-${{ matrix.artifact_arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Linux ${{ matrix.artifact_arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            core_target: linux-x64
            flutter_target: linux-x64
            flutter_sdk: archive
            bundle_arch: x64
            deb_arch: amd64
            artifact_arch: x64
          - runner: ubuntu-22.04-arm
            core_target: linux-arm64
            flutter_target: linux-arm64
            flutter_sdk: source
            bundle_arch: arm64
            deb_arch: arm64
            artifact_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          export NEEDRESTART_SUSPEND=1
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo -E apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libayatana-appindicator3-dev libnotify-dev

      - name: Set up Flutter
        if: matrix.flutter_sdk == 'archive'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check out Flutter source for ARM64
        if: matrix.flutter_sdk == 'source'
        uses: actions/checkout@v6
        with:
          repository: flutter/flutter
          ref: stable
          path: flutter-sdk
          fetch-depth: 0

      - name: Bootstrap Flutter for ARM64
        if: matrix.flutter_sdk == 'source'
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/flutter-sdk/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/flutter-sdk/bin/flutter" --version

      - name: Build, bundle, and verify Linux release
        shell: bash
        run: |
          chmod +x tool/prepare_aria2_next.sh tool/package_linux_release.sh
          tool/package_linux_release.sh \
            '${{ matrix.core_target }}' \
            '${{ matrix.flutter_target }}' \
            '${{ matrix.bundle_arch }}' \
            '${{ matrix.deb_arch }}' \
            '${{ needs.prepare.outputs.version_name }}' \
            '${{ needs.prepare.outputs.build_number }}' \
            '${{ needs.prepare.outputs.tag_name }}' \
            '${{ matrix.artifact_arch }}' \
            '${{ github.workspace }}/dist'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: setsuna-linux-${{ matrix.artifact_arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          cd dist
          sha256sum Setsuna_* > "Setsuna_${{ needs.prepare.outputs.tag_name }}_checksums.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            This release bundles the pinned Aria2 Next engine for each supported desktop target.

            macOS packages are notarized when the release signing secrets are
            configured. Otherwise, they are ad hoc-signed and may require a
            Gatekeeper override before first use.

            Available packages:
            - Windows x64 portable ZIP
            - macOS DMG for Apple Silicon and Intel
            - Linux portable tarball and Debian package for x64 and ARM64
